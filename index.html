<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>이상형 월드컵</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ================= 시작 화면 ================= -->
  <section id="screen-start" class="screen is-active">
    <div class="start-card">
      <p class="start-eyebrow" id="siteSubtitle">여돌 직캠 VS 남돌 직캠</p>
      <h1 class="start-title" id="siteTitle">이상형 월드컵</h1>

      <div class="field">
        <label for="roundSelect">총 라운드를 선택하세요</label>
        <select id="roundSelect"></select>
      </div>

      <p class="pool-info" id="poolInfo"></p>

      <div class="start-actions">
        <button id="startBtn" class="btn btn-primary">시작하기</button>
      </div>

      <p class="start-note">모든 대결은 <b>여자 아이돌 직캠 vs 남자 아이돌 직캠</b>으로 진행됩니다.</p>
    </div>
  </section>

  <!-- ================= 대결 화면 ================= -->
  <section id="screen-battle" class="screen">
    <header class="battle-header">
      <span id="roundLabel" class="round-label">32강</span>
      <span id="matchProgress" class="match-progress">1/16</span>
    </header>

    <div class="battle-board">
      <div class="pick" data-side="left">
        <div class="video-wrap">
          <iframe id="frameLeft" title="왼쪽 후보 영상"
            src="" frameborder="0"
            allow="accelerometer; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <div class="pick-info">
          <p class="pick-name" id="nameLeft">-</p>
          <p class="pick-group" id="groupLeft">-</p>
        </div>
        <button class="pick-select" id="pickLeft" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          선택
        </button>
      </div>

      <div class="vs-badge" aria-hidden="true"><span class="vs-text">VS</span></div>

      <div class="pick" data-side="right">
        <div class="video-wrap">
          <iframe id="frameRight" title="오른쪽 후보 영상"
            src="" frameborder="0"
            allow="accelerometer; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
        <div class="pick-info">
          <p class="pick-name" id="nameRight">-</p>
          <p class="pick-group" id="groupRight">-</p>
        </div>
        <button class="pick-select" id="pickRight" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          선택
        </button>
      </div>
    </div>

    <button id="backToStartBtn" class="btn btn-ghost btn-small">처음으로</button>
  </section>

  <!-- ================= 결과 화면 ================= -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <p class="result-eyebrow">우승</p>
      <div class="video-wrap video-wrap--result">
        <iframe id="frameResult" title="우승 영상"
          src="" frameborder="0"
          allow="accelerometer; encrypted-media; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <h2 class="result-name" id="resultName">-</h2>
      <p class="result-group" id="resultGroup">-</p>

      <div class="start-actions">
        <button id="restartBtn" class="btn btn-primary">다시하기</button>
      </div>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
