<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>데이터 편집기 - 아이돌 챌린지 월드컵</title>
<link rel="stylesheet" href="style.css" />
<style>
  .editor-table {
    width: 100%;
    border-collapse: collapse;
  }
  .editor-row {
    background: var(--bg-soft);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    display: grid;
    grid-template-columns: 90px repeat(6, 1fr) auto;
    gap: 8px;
    align-items: center;
  }
  @media (max-width: 1000px) {
    .editor-row {
      grid-template-columns: 1fr 1fr;
    }
  }
  .editor-row input, .editor-row select {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 8px;
    padding: 7px 8px;
    font-size: 12px;
    font-family: inherit;
  }
  .editor-row label {
    font-size: 10px;
    color: var(--text-faint);
    display: block;
    margin-bottom: 3px;
  }
  .editor-thumb {
    width: 90px;
    height: 50px;
    object-fit: cover;
    border-radius: 6px;
    background: #000;
  }
  .field { min-width: 0; }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .count-badge {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: auto;
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <div class="brand">
        <span class="logo-mark">데이터 <span>편집기</span></span>
        <span class="logo-sub">항목을 고치고 새 data.js를 내려받으세요</span>
      </div>
      <div class="header-actions">
        <a class="btn ghost" href="index.html">월드컵으로</a>
      </div>
    </header>

    <main>
      <div class="panel" style="margin-bottom:20px;">
        <p style="margin:0;color:var(--text-dim);font-size:13px;line-height:1.6;">
          이 페이지는 서버 없이 브라우저에서만 동작합니다. 항목을 수정한 뒤
          <b>data.js 다운로드</b> 버튼을 누르면 새 파일이 만들어져요. 그 파일로
          프로젝트 폴더의 <code>data.js</code>를 덮어쓰고 다시 깃허브에 올리면 반영됩니다.
          (이 페이지에서 고친 내용은 저장하지 않는 이상 새로고침하면 사라지니 꼭 다운로드하세요!)
        </p>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="add-btn">+ 새 항목 추가</button>
        <button class="btn" id="download-btn">⬇ data.js 다운로드</button>
        <span class="count-badge" id="count-badge"></span>
      </div>

      <div id="rows"></div>
    </main>

    <footer class="site-footer">개인 제작 팬 콘텐츠</footer>
  </div>

  <script src="data.js"></script>
  <script src="editor.js"></script>
</body>
</html>
